<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Chatbot IA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 500px;
            height: 600px;
            background: #16213e;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .chat-header {
            background: #0f3460;
            padding: 20px;
            text-align: center;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.user {
            background: #0f3460;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            background: #e94560;
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.loading {
            background: #333;
            color: #aaa;
            align-self: flex-start;
        }

        .chat-input {
            display: flex;
            padding: 16px;
            gap: 10px;
            background: #0f3460;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            background: #16213e;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .chat-input button {
            padding: 12px 20px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .chat-input button:hover {
            background: #c73652;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">🤖 Chatbot IA</div>
    <div class="chat-messages" id="messages">
        <div class="message bot">Olá! Sou seu assistente virtual. Como posso te ajudar?</div>
    </div>
    <div class="chat-input">
        <input type="text" id="input" placeholder="Digite sua mensagem..." onkeypress="handleKey(event)"/>
        <button onclick="enviar()">Enviar</button>
    </div>
</div>

<script>
    async function enviar() {
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');
        const texto = input.value.trim();

        if (!texto) return;

        // mensagem do usuário
        messages.innerHTML += `<div class="message user">${texto}</div>`;
        input.value = '';

        // loading
        const loadingId = 'loading-' + Date.now();
        messages.innerHTML += `<div class="message loading" id="${loadingId}">Digitando...</div>`;
        messages.scrollTop = messages.scrollHeight;

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: texto
            });

            const resposta = await response.text();

            // remove loading e adiciona resposta
            document.getElementById(loadingId).remove();
            const formatado = resposta
                .replace(/\n/g, '<br>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            messages.innerHTML += `<div class="message bot">${formatado}</div>`;

        } catch (error) {
            document.getElementById(loadingId).remove();
            messages.innerHTML += `<div class="message bot">Erro ao conectar com o servidor.</div>`;
        }

        messages.scrollTop = messages.scrollHeight;
    }

    function handleKey(event) {
        if (event.key === 'Enter') enviar();
    }
</script>
</body>
</html>
